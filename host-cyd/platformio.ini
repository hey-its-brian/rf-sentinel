; rf-sentinel-cyd: host UI for the RF Sentinel node on the 2.8" ESP32-2432S028R
; (single USB-C revision, ILI9341 + XPT2046). Talks to the C5 node over UART2.

[env:cyd28]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = dio
board_build.partitions = huge_app.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.2.29
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_CYD28_USBC
    -DRFS_HOST_VERSION=\"0.1.0\"
    ; the USB-C revision I have ships an ILI9341; if colours look inverted or the
    ; panel is mirrored, flip LCD_INVERT / LCD_RGB_ORDER in include/board.h
