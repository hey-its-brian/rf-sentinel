# Builds both firmwares on every push and pull request.
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ["web/**", "docs/**", "*.md"]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    name: Node (ESP32-C5, ESP-IDF 5.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c5
          path: .
          command: idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: node-bin
          path: build/rf_sentinel.bin

  host-cyd:
    name: Host (CYD 2.8", PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet platformio
      - run: pio run -d host-cyd
      - uses: actions/upload-artifact@v4
        with:
          name: host-cyd-bin
          path: host-cyd/.pio/build/cyd28/firmware.bin
