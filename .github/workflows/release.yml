# Tag vX.Y.Z (tools/release.sh does it) and this builds both firmwares, makes
# the full-flash images and publishes the GitHub release. pages.yml then runs
# from main and deploys the web flasher with that release's images.
#
#   rf-sentinel-node-vX.Y.Z-full.bin   Stamp C5, write at 0x0
#   rf-sentinel-cyd-vX.Y.Z-full.bin    CYD 2.8" host, write at 0x0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1
          target: esp32c5
          path: .
          command: idf.py build && idf.py merge-bin -o rf-sentinel-node-full.bin
      - uses: actions/upload-artifact@v4
        with:
          name: node-full
          path: build/rf-sentinel-node-full.bin

  host-cyd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet platformio esptool
      - run: pio run -d host-cyd
      - name: Merge into one image
        run: |
          b=host-cyd/.pio/build/cyd28
          app0=$(find ~/.platformio/packages -name boot_app0.bin | head -1)
          python -m esptool --chip esp32 merge_bin -o rf-sentinel-cyd-full.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x1000 $b/bootloader.bin 0x8000 $b/partitions.bin 0xe000 "$app0" 0x10000 $b/firmware.bin
      - uses: actions/upload-artifact@v4
        with:
          name: cyd-full
          path: rf-sentinel-cyd-full.bin

  publish:
    needs: [node, host-cyd]
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.meta.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - id: meta
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then tag=$(git describe --tags --abbrev=0); fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ver=${tag#v}" >> "$GITHUB_OUTPUT"
          mv dist/node-full/rf-sentinel-node-full.bin "dist/rf-sentinel-node-$tag-full.bin"
          mv dist/cyd-full/rf-sentinel-cyd-full.bin "dist/rf-sentinel-cyd-$tag-full.bin"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.meta.outputs.tag }}
          notes="docs/releases/$tag.md"
          [[ -f "$notes" ]] || { notes=$(mktemp); echo "RF Sentinel $tag" > "$notes"; }
          gh release create "$tag" dist/*.bin --title "$tag" --notes-file "$notes" --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-bins
          path: dist/*.bin
